<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Bouquet - Untukmu</title>
    <style>
        :root {
            /* Palet Warna Hangat & Romantis */
            --bg-color: #fdf5f2;
            --pot-color: #d49a89;
            --stem-color: #87a887;
            --leaf-color: #9lb391;
            --petal-color: #ffb7c5;
            --petal-dark: #f0a6b4;
            --center-light: #fff9e6; /* Warna inti tengah cerah */
            --center-dark: #fdd487;  /* Warna inti pinggir emas */
            --text-color: #8c6a6a;
            --font-main: 'Segoe UI', 'Helvetica Neue', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: var(--font-main);
            overflow: hidden;
        }

        /* --- Trigger Mekanisme (State Manager) --- */
        #bloom-trigger {
            display: none;
        }

        .container {
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Bagian Teks Romantis --- */
        .message-container {
            height: 60px;
            margin-bottom: 30px;
            position: relative;
            width: 320px;
        }

        .message {
            position: absolute;
            width: 100%;
            left: 0;
            top: 0;
            opacity: 0;
            transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-color);
            font-weight: 300;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .msg-1 { opacity: 1; }

        #bloom-trigger:checked ~ .message-container .msg-1 { opacity: 0; transition-duration: 0.5s; }
        
        #bloom-trigger:checked ~ .message-container .msg-2 { 
            opacity: 1; 
            transition-delay: 1.5s; 
        }
        
        #bloom-trigger:checked ~ .message-container .msg-3 { 
            opacity: 1; 
            transition-delay: 4.5s; 
        }
        
        #bloom-trigger:checked ~ .message-container .msg-2 {
            animation: fadeOutText 1s forwards;
            animation-delay: 4s;
        }

        @keyframes fadeOutText {
            to { opacity: 0; }
        }

        /* --- Area Visual Bunga --- */
        .bouquet-area {
            position: relative;
            cursor: pointer;
            width: 220px;
            height: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            -webkit-tap-highlight-color: transparent;
        }

        /* Pot Bunga */
        .pot {
            width: 90px;
            height: 75px;
            background-color: var(--pot-color);
            clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%);
            z-index: 10;
            position: relative;
            box-shadow: inset 0 10px 15px rgba(0,0,0,0.08);
            border-radius: 2px;
        }

        .pot::after {
            content: '';
            position: absolute;
            top: 0;
            left: -5%;
            width: 110%;
            height: 12px;
            background-color: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        /* Batang Bunga */
        .stem {
            width: 7px;
            height: 0;
            background-color: var(--stem-color);
            position: absolute;
            bottom: 70px;
            transition: height 2.5s cubic-bezier(0.45, 0.05, 0.55, 0.95);
            border-radius: 4px;
            z-index: 5;
        }

        #bloom-trigger:checked ~ .bouquet-area .stem {
            height: 180px;
        }

        /* Daun */
        .leaf {
            position: absolute;
            width: 35px;
            height: 18px;
            background-color: var(--stem-color);
            border-radius: 20px 0;
            opacity: 0;
            transform: scale(0) rotate(0deg);
            transform-origin: center bottom;
            transition: all 1.2s ease-out;
        }

        .leaf.left {
            bottom: 120px;
            left: 70px;
            border-radius: 0 20px;
        }

        .leaf.right {
            bottom: 150px;
            right: 70px;
        }

        #bloom-trigger:checked ~ .bouquet-area .leaf.left {
            opacity: 1;
            transform: scale(1) rotate(-25deg);
            transition-delay: 1.8s;
        }
        #bloom-trigger:checked ~ .bouquet-area .leaf.right {
            opacity: 1;
            transform: scale(1) rotate(25deg);
            transition-delay: 2.2s;
        }

        /* --- Kepala Bunga (Wadah Kelopak) --- */
        .flower-head {
            position: absolute;
            bottom: 240px; /* Sedikit disesuaikan agar pas di ujung batang */
            width: 0px;
            height: 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20; /* Z-index tinggi agar di depan batang */
            pointer-events: none;
        }

        /* Kelopak Individual */
        .petal {
            position: absolute;
            background: linear-gradient(to bottom, var(--petal-color), var(--petal-dark));
            width: 45px;
            height: 55px;
            border-radius: 50% 50% 10% 10% / 60% 60% 10% 10%;
            opacity: 0;
            transform: rotate(0deg) translateY(0) scale(0);
            transform-origin: center;
            transition: all 2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 5px rgba(240, 166, 180, 0.4);
        }

        /* --- PERBAIKAN INTI KELOPAK (CENTER DOT) --- */
        .center-dot {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at center, var(--center-light) 20%, var(--center-dark) 100%);
            border-radius: 50%;
            z-index: 25;
            position: absolute;
            left: 50%;
            top: 52%; /* turunkan sedikit agar berada pas ditengah petals */
            opacity: 0;
            transform: translate(-50%, -50%) scale(0) translateY(20px);
            box-shadow: 0 0 10px rgba(255, 219, 125, 0.6);
            transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition-delay: 2.2s;
        }

        /* Pastikan transform tetap terpusat saat mekar (override rule yang ada) */
        #bloom-trigger:checked ~ .bouquet-area .center-dot {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1) translateY(6px) !important;
        }

        /* --- Animasi Mekar (Bloom) --- */
        #bloom-trigger:checked ~ .bouquet-area .petal {
            opacity: 1;
            transition-delay: 3s;
        }
        
        #bloom-trigger:checked ~ .bouquet-area .center-dot {
            opacity: 1;
            transform: scale(1) translateY(5px);
        }

        /* Posisi akhir kelopak */
        #bloom-trigger:checked ~ .bouquet-area .petal:nth-child(1) { transform: rotate(0deg) translateY(-30px) scale(1); }
        #bloom-trigger:checked ~ .bouquet-area .petal:nth-child(2) { transform: rotate(72deg) translateY(-30px) scale(1); }
        #bloom-trigger:checked ~ .bouquet-area .petal:nth-child(3) { transform: rotate(144deg) translateY(-30px) scale(1); }
        #bloom-trigger:checked ~ .bouquet-area .petal:nth-child(4) { transform: rotate(216deg) translateY(-30px) scale(1); }
        #bloom-trigger:checked ~ .bouquet-area .petal:nth-child(5) { transform: rotate(288deg) translateY(-30px) scale(1); }
        /* --- Tip Petunjuk --- */
        .hint {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #c7b2b2;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulseHint 2.5s infinite ease-in-out;
        }

        #bloom-trigger:checked ~ .hint {
            opacity: 0;
            transition: opacity 0.5s;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.5; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
        }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="Lany.mp3">
    </audio>

    <div class="container">
        <input type="checkbox" id="bloom-trigger">

        <div class="message-container">
            <div class="message msg-1">Your Belated Gift.</div>
            <div class="message msg-2">Sherina.</div>

        </div>

        <label for="bloom-trigger" class="bouquet-area">
            <div class="flower-head">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="center-dot"></div>
            </div>
            <div class="leaf left"></div>
            <div class="leaf right"></div>
            <div class="stem"></div>
            <div class="pot"></div>
        </label>

        <div class="hint">Sentuh pot</div>
    </div>

    <script>
        const bloomTrigger = document.getElementById('bloom-trigger');
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.4;

        bloomTrigger.addEventListener('change', function() {
            if (this.checked) {
                bgMusic.play().catch(error => {
                    console.log("Autoplay dicegah browser sampai ada interaksi.");
                });
            } else {
                bgMusic.pause();
                bgMusic.currentTime = 0;
            }
        });
    </script>

</body>
</html>
