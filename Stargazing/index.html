<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1330">
  <meta name="description" content="Sebuah pemandangan bulan dan bintang yang tenang dengan pengiring Music Box.">
  <title>Di Bawah Bulan — Stargazing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>


  <main class="scene" aria-label="Pemandangan bulan dan bintang">
    <div class="sky-glow" aria-hidden="true"></div>
    <div class="star-field" id="star-field" aria-hidden="true"></div>
    <div class="distant-haze" aria-hidden="true"></div>

    <section class="experience" aria-labelledby="moon-description">
      <div class="moon-wrap" role="img" aria-label="Bulan malam ini" id="moon-description">
        <div class="moon-halo" aria-hidden="true"></div>
        <div class="moon" id="moon" aria-hidden="true">
          <span class="moon-shadow" id="moon-shadow"></span>
          <span class="moon-detail detail-one"></span>
          <span class="moon-detail detail-two"></span>
          <span class="moon-detail detail-three"></span>
        </div>
      </div>
      <p id="click-hint" class="click-hint">Tap anywhere to play music</p>
    </section>

    <div class="horizon" aria-hidden="true"><div class="hill hill-back"></div><div class="hill hill-front"></div></div>
  </main>

  

  

  <noscript><style>.no-script{display:block}</style></noscript>
</body>
</html>
